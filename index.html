<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Forma">
<title>Forma by Gubiolo</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFC81F">
<style>
/* VOICE: a shipped iPadOS 26 pro app — calm, precise, the canvas is the hero.
   IDEA: a drawing table under floating Liquid Glass controls.
   PICTURE: the live canvas with artboards fills the screen.
   COLOUR/TYPE: system greys, iOS blue accent, SF system font.
   LAYOUT: floating glass top bar, side panels and bottom tool palette, inset from edges. */
:root{color-scheme:light dark;
--canvas:light-dark(#e4e4e9,#151517);--glass:light-dark(rgba(250,250,253,.6),rgba(40,40,44,.58));
--edge:light-dark(rgba(255,255,255,.75),rgba(255,255,255,.12));--hair:light-dark(rgba(60,60,67,.13),rgba(255,255,255,.09));
--ink:light-dark(#1c1c1e,#f5f5f7);--ink2:light-dark(rgba(60,60,67,.62),rgba(235,235,245,.6));--ink3:light-dark(rgba(60,60,67,.32),rgba(235,235,245,.28));
--accent:light-dark(#007aff,#0a84ff);--asoft:light-dark(rgba(0,122,255,.13),rgba(10,132,255,.24));
--fill:light-dark(rgba(118,118,128,.11),rgba(118,118,128,.24));--fill2:light-dark(rgba(118,118,128,.2),rgba(118,118,128,.38));
--red:light-dark(#ff3b30,#ff453a);
--shadow:light-dark(0 12px 40px rgba(0,0,0,.12),0 12px 40px rgba(0,0,0,.5));
--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:var(--canvas);color:var(--ink);font:13px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;touch-action:none;overflow:hidden}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#overlay{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.nd{position:absolute;box-sizing:border-box;transform-origin:50% 50%}
.nd>svg{position:absolute;left:0;top:0;overflow:visible}
.ab{box-shadow:0 1px 3px rgba(0,0,0,.1),0 0 0 .5px rgba(0,0,0,.08)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(30px) saturate(1.9);backdrop-filter:blur(30px) saturate(1.9);border:.5px solid var(--edge);box-shadow:var(--shadow),inset 0 1px 0 light-dark(rgba(255,255,255,.6),rgba(255,255,255,.08))}
#top{position:fixed;left:12px;right:12px;top:calc(var(--st) + 10px);display:flex;justify-content:space-between;pointer-events:none;z-index:20}
.cl{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;pointer-events:auto}
.b{width:40px;height:40px;border:0;border-radius:999px;background:none;display:grid;place-items:center;cursor:pointer;touch-action:manipulation;transition:background .15s,transform .15s}
.b:active{background:var(--fill2);transform:scale(.94)}
.b svg{width:21px;height:21px}
.b.on{background:var(--accent);color:#fff}
.b:disabled{opacity:.28}
.b.sm{width:30px;height:30px}.b.sm svg{width:17px;height:17px}
.tt{height:40px;border:0;background:none;border-radius:999px;padding:0 12px 0 10px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:4px;cursor:pointer;max-width:240px}
.tt span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt svg{width:14px;height:14px;color:var(--ink2);flex:none}
.zpm{width:32px!important;min-width:32px!important}.zpm svg{width:17px;height:17px}.zb{min-width:54px!important;padding:0 4px!important}
.zb{height:40px;border:0;background:none;border-radius:999px;padding:0 10px;font-weight:600;font-variant-numeric:tabular-nums;min-width:62px;cursor:pointer}
.sep{width:.5px;height:22px;background:var(--hair);margin:0 4px}
.panel{position:fixed;top:calc(var(--st) + 66px);bottom:calc(var(--sb) + 12px);width:262px;border-radius:26px;display:flex;flex-direction:column;overflow:hidden;z-index:15;transition:transform .38s cubic-bezier(.2,.9,.25,1.05),opacity .25s}
#layers{left:12px;bottom:calc(var(--sb) + 80px)}#insp{right:12px;width:300px}
#layers.off{transform:translateX(calc(-100% - 20px));opacity:0;pointer-events:none}
#insp.off{transform:translateX(calc(100% + 20px));opacity:0;pointer-events:none}
.ph{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 6px 18px;font-weight:700;font-size:17px}
.pb{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 8px 14px;touch-action:pan-y}
.row{position:relative;display:flex;align-items:center;gap:4px;height:36px;border-radius:11px;padding-right:2px;cursor:default}
.row.sel{background:var(--asoft)}.row.sel .nm{font-weight:600}
.row.dim .nm,.row.dim .ic{opacity:.4}
.row .tw{width:18px;height:28px;display:grid;place-items:center;color:var(--ink2);flex:none}
.row .tw svg{width:12px;height:12px;transition:transform .2s}.row .tw.open svg{transform:rotate(90deg)}
.row .ic{width:16px;height:16px;color:var(--ink2);flex:none}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
.row .nm input{width:100%;font:inherit;border:0;border-radius:6px;padding:4px 6px;background:var(--fill);color:var(--ink);outline:2px solid var(--accent)}
.row .mi{width:30px;height:30px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--ink3);flex:none}
.row .mi svg{width:16px;height:16px}.row .mi.act{color:var(--ink)}
.row .gr{width:28px;height:30px;display:grid;place-items:center;color:var(--ink3);touch-action:none;flex:none}
.row .gr svg{width:16px;height:16px}
.row.ab-row .nm{font-weight:600}
#dropline{position:absolute;height:2px;background:var(--accent);border-radius:2px;pointer-events:none;display:none;left:8px;right:8px}
#dropline.in{height:36px;background:var(--asoft);border:2px solid var(--accent);border-radius:11px}
.empty{color:var(--ink2);padding:24px 14px;text-align:center;line-height:1.45}
.sec{padding:12px 8px 14px;border-top:.5px solid var(--hair)}
.sec:first-child{border-top:0;padding-top:4px}
.sh{display:flex;align-items:center;justify-content:space-between;margin:0 2px 8px 4px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:6px}
.g2+.g2{margin-top:6px}
.f{display:flex;align-items:center;background:var(--fill);border-radius:10px;height:34px;padding:0 4px 0 0;gap:2px}
.f label{min-width:26px;height:100%;display:grid;place-items:center;color:var(--ink2);font-size:11.5px;font-weight:500;cursor:ew-resize;touch-action:none}
.f label svg{width:14px;height:14px}
.f input{flex:1;width:100%;border:0;background:none;color:var(--ink);font:inherit;font-size:13.5px;font-variant-numeric:tabular-nums;outline:none;padding:0;-webkit-user-select:text;user-select:text}
.f input::placeholder{color:var(--ink3);text-transform:none}
.f:focus-within{box-shadow:0 0 0 2px var(--accent)}
.f .u{color:var(--ink3);padding-right:6px;font-size:12px}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{flex:1;height:32px;border:0;background:none;border-radius:8px;display:grid;place-items:center;cursor:pointer}
.seg button:active{background:var(--glass)}.seg button:disabled{opacity:.3}
.seg svg{width:18px;height:18px}
.seg+.seg{margin-top:6px}
.cr{display:flex;align-items:center;gap:6px}
.cr+.cr{margin-top:6px}
.sw{position:relative;width:34px;height:34px;border-radius:10px;overflow:hidden;flex:none;box-shadow:inset 0 0 0 .5px var(--hair);background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/10px 10px}
.sw i{position:absolute;inset:0}
.sw input{position:absolute;inset:-8px;width:calc(100% + 16px);height:calc(100% + 16px);opacity:0;cursor:pointer}
.cr .f{flex:1}.cr .f.pc{flex:0 0 74px}
.tg{width:34px;height:34px;border:0;border-radius:10px;background:none;display:grid;place-items:center;color:var(--ink2);flex:none;cursor:pointer}
.tg svg{width:18px;height:18px}
.off-sec .cr,.off-sec .seg,.off-sec .gbar,.off-sec .gtip,.off-sec .g2{opacity:.35;pointer-events:none}
.sh .tg{width:32px;height:32px;margin:-8px -4px -8px 0}
.gtip{color:var(--ink2);font-size:12px;margin:8px 4px 12px;text-align:center}
.sec .seg.full{margin-bottom:12px}
.switch{position:relative;width:51px;height:31px;border-radius:999px;background:var(--fill2);border:0;flex:none;cursor:pointer;transition:background .2s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s cubic-bezier(.3,1.4,.5,1)}
.switch.on{background:#34c759}.switch.on::after{transform:translateX(20px)}
.lr{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 4px;font-size:14px}
.lr small{display:block;color:var(--ink2);font-size:12px;margin-top:2px;line-height:1.35}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:34px;background:none;margin:0 4px}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:4px;background:var(--fill2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;margin-top:-10px;box-shadow:0 2px 8px rgba(0,0,0,.22),0 0 0 .5px rgba(0,0,0,.06)}
.presets{display:grid;gap:2px}
.pr{display:flex;justify-content:space-between;align-items:center;border:0;background:none;border-radius:10px;padding:10px 8px;text-align:left;font-size:14px;cursor:pointer}
.pr:active{background:var(--fill)}.pr span{color:var(--ink2);font-size:12.5px;font-variant-numeric:tabular-nums}
.tip{color:var(--ink2);font-size:12.5px;line-height:1.5;padding:2px 4px}
.tip b{color:var(--ink);font-weight:600}
.wide{width:100%;height:36px;border:0;border-radius:10px;background:var(--fill);font-weight:600;cursor:pointer}
.wide:active{background:var(--fill2)}
#tools{position:fixed;left:50%;bottom:calc(var(--sb) + 14px);transform:translateX(-50%);display:flex;gap:3px;padding:6px;border-radius:999px;z-index:20}
#tools .b{width:46px;height:46px}#tools .b svg{width:23px;height:23px}
#tools .sep{height:26px;align-self:center}
.menu{position:fixed;z-index:40;border-radius:20px;padding:6px;transform-origin:top center;animation:pop .22s cubic-bezier(.2,1.2,.4,1)}
.menu.hidden{display:none!important}
@keyframes pop{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:none}}
#qm{display:grid;grid-template-columns:repeat(4,auto);gap:2px}
.qi{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 6px 7px;min-width:72px;border:0;background:none;border-radius:14px;font-size:11.5px;cursor:pointer}
.qi svg{width:22px;height:22px}
.qi:active{background:var(--fill2)}.qi:disabled{opacity:.28}.qi.red{color:var(--red)}
#pop{min-width:250px;max-height:calc(100vh - 24px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.mi2{display:flex;align-items:center;justify-content:space-between;gap:24px;width:100%;border:0;background:none;border-radius:12px;padding:11px 12px;font-size:15px;text-align:left;cursor:pointer}
.mi2:active{background:var(--fill2)}.mi2 kbd{font:inherit;color:var(--ink2);font-size:13px}
.mi2 svg{width:19px;height:19px;color:var(--ink2)}
.mline{height:.5px;background:var(--hair);margin:4px 10px}
#hud{position:fixed;left:50%;top:calc(var(--st) + 70px);transform:translate(-50%,-8px);padding:8px 16px;border-radius:999px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .25s;z-index:50;display:flex;gap:6px;align-items:center}
#hud svg{width:16px;height:16px}
#hud.show{opacity:1;transform:translate(-50%,0)}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 84px);transform:translate(-50%,8px);max-width:min(520px,90vw);padding:11px 18px;border-radius:18px;font-size:13.5px;line-height:1.4;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .3s;z-index:50}
#toast.show{opacity:1;transform:translate(-50%,0)}
#sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:rgba(0,0,0,.18)}
#sheet.hidden{display:none}
#sheet .card{width:min(520px,92vw);max-height:80vh;overflow:auto;border-radius:28px;padding:22px 24px;animation:pop .25s cubic-bezier(.2,1.2,.4,1)}
#sheet h2{margin:0 0 12px;font-size:22px}
#sheet h3{margin:16px 0 6px;font-size:13px;color:var(--ink2);font-weight:600}
#sheet dl{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:14px}
#sheet dt{font-weight:600}#sheet dd{margin:0;color:var(--ink2)}
.abt{font:500 11.5px -apple-system,system-ui,sans-serif;fill:var(--abt,var(--ink2))}
.abt.on{fill:var(--accent)}
/* fields scrub + color picker */
.f{touch-action:pan-y;cursor:ew-resize}.f:has([data-hex]){cursor:text}
.f input{pointer-events:none}.f input:focus{pointer-events:auto;cursor:text}
.f.nf{cursor:text;touch-action:auto}.f.nf input{pointer-events:auto}
.sw{border:0;padding:0;cursor:pointer}
#cp{width:292px;padding:12px}
.cpt{display:flex;align-items:center;gap:8px;margin-bottom:12px}.cpt .seg{flex:1}
.cpt .seg button{font-size:12.5px;font-weight:600}.cpt .seg button.on{background:light-dark(#fff,rgba(255,255,255,.16));box-shadow:0 1px 3px rgba(0,0,0,.12)}
.sv{position:relative;height:172px;border-radius:14px;touch-action:none;background-image:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,rgba(255,255,255,0))}
.knob{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35),inset 0 0 0 .5px rgba(0,0,0,.2);pointer-events:none}
.sl{position:relative;height:28px;border-radius:14px;margin-top:12px;touch-action:none;box-shadow:inset 0 0 0 .5px var(--hair)}
.sl .knob{top:50%}
.sl.hue{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.sl.alpha{background:conic-gradient(#ccc 25%,#fff 0 50%,#ccc 0 75%,#fff 0) 0 0/10px 10px}
.sl.alpha b{position:absolute;inset:0;border-radius:inherit}
.rgbr{display:flex;align-items:center;gap:8px}.rgbr>span,.rgbr em{margin-top:12px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.rgbr>span{width:12px;font-weight:700}.rgbr .sl{flex:1}.rgbr em{width:28px;text-align:right;font-style:normal}
.docc{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.docc button{width:28px;height:28px;border-radius:8px;border:0;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15);cursor:pointer}
/* phase 2 */
.seg button{font-size:12.5px;font-weight:600}
.seg button.on{background:light-dark(#fff,rgba(255,255,255,.16));box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.mini{padding:2px}.seg.mini button{height:24px;font-size:11.5px;padding:0 7px;flex:none}
.fbtn{display:flex;align-items:center;justify-content:space-between;gap:6px;width:100%;height:34px;border:0;border-radius:10px;background:var(--fill);padding:0 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.fbtn span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}.fbtn svg{width:14px;height:14px;color:var(--ink2);flex:none}
.wide.sm2{height:34px;font-size:12.5px}
.gbar{position:relative;height:34px;border-radius:10px;touch-action:none;box-shadow:inset 0 0 0 .5px var(--hair);margin:4px 12px 0}
.gs{position:absolute;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;border:3px solid #fff;background:var(--c);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.gs.on{outline:2px solid var(--accent);outline-offset:1px}
#fp{width:290px;padding:10px}
.fl{max-height:min(430px,58vh);overflow-y:auto;touch-action:pan-y;display:grid;gap:1px;-webkit-overflow-scrolling:touch}
.fi{display:flex;justify-content:space-between;align-items:center;gap:8px;border:0;background:none;border-radius:10px;padding:9px 10px;font-size:18px;text-align:left;cursor:pointer;color:var(--ink)}
.fi span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.fi small{font:500 11px -apple-system,system-ui;color:var(--ink2);flex:none}
.fi.on{background:var(--asoft)}.fi:active{background:var(--fill2)}
.mgh,.mcl,.mst{position:absolute;inset:0}.mcl{overflow:hidden}.mgh{opacity:.32}.mst{pointer-events:none}
.mgh>*,.mcl>*{position:absolute;max-width:none;display:block;pointer-events:none;-webkit-user-drag:none;object-fit:fill}
.nd.tx{padding:0;overflow-wrap:break-word}
.nd[contenteditable=true],.nd[contenteditable=plaintext-only]{-webkit-user-select:text;user-select:text;cursor:text;outline:none;caret-color:var(--accent)}
#mods{position:fixed;left:12px;bottom:calc(var(--sb) + 14px);display:flex;flex-direction:column;gap:3px;padding:6px;border-radius:999px;z-index:20;transition:left .38s cubic-bezier(.2,.9,.25,1.05)}

.mcl>i.mov{left:0;top:0;width:100%;height:100%}
.fxb{padding:10px 0 4px;border-top:.5px solid var(--hair)}.fxb:first-of-type{border-top:0}

.adj{display:grid;grid-template-columns:84px minmax(0,1fr) 62px;align-items:center;gap:4px;font-size:13px}
.adj+.adj{margin-top:2px}.adj>span{color:var(--ink2)}.adj input[type=range]{margin:0}
.adj .f.pc{flex:none}
#sheet .card.wcard{width:min(780px,94vw)}
.shh{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.shh h2{margin:0}
.xl{display:grid;gap:2px;max-height:38vh;overflow:auto;touch-action:pan-y}
.xr{display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:10px 10px;text-align:left;font-size:15px;cursor:pointer;color:var(--ink)}

.xr .ck{width:24px;height:24px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--ink3);display:grid;place-items:center;color:transparent;flex:none}
.xr .ck svg{width:15px;height:15px}.xr.on .ck{background:var(--accent);box-shadow:none;color:#fff}
.wide.primary{background:var(--accent);color:#fff;height:46px;font-size:16px;border-radius:14px}.wide.primary:disabled{opacity:.6}
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;max-height:58vh;overflow:auto;touch-action:pan-y;padding:2px}
.dcard,.dnew{position:relative;border-radius:16px;background:var(--fill);padding:8px;cursor:pointer;display:flex;flex-direction:column;gap:8px;border:0;color:var(--ink);text-align:left}
.dcard.cur{box-shadow:0 0 0 2.5px var(--accent)}
.dth{aspect-ratio:4/3;border-radius:10px;background:#fff center/contain no-repeat;box-shadow:inset 0 0 0 .5px var(--hair)}
.dmeta{padding:0 4px 2px;min-width:0}.dnm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:26px}
.ddt{font-size:12px;color:var(--ink2);margin-top:2px}.dcard [data-dmore]{position:absolute;right:6px;bottom:8px}
.dnew{align-items:center;justify-content:center;min-height:150px;font-weight:600;font-size:14px;color:var(--accent)}.dnew svg{width:28px;height:28px}
.dren{width:100%;font:inherit;font-weight:600;font-size:14px;border:0;border-radius:8px;padding:4px 6px;background:var(--glass);color:var(--ink);outline:2px solid var(--accent)}
.recs{display:flex;gap:6px;margin-top:8px;overflow-x:auto;touch-action:pan-x;padding:1px}
.recs button,.docc button{width:26px;height:26px;border-radius:8px;flex:none;border:0;cursor:pointer;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.18)}
.cpl{font-size:11.5px;font-weight:600;color:var(--ink2);margin:12px 2px -4px}
.scn{color:var(--ink2);font-size:12px;font-variant-numeric:tabular-nums;min-width:30px;text-align:right;padding-right:4px}
#fp .wide{width:100%}.fdel{font-style:normal;display:inline-grid;place-items:center;width:18px;height:18px;margin-left:4px;border-radius:9px;background:var(--fill);color:var(--ink2);font-size:13px;line-height:1;cursor:pointer}
.fimgb{display:grid;place-items:end center;width:100%;height:96px;margin-top:8px;border:0;border-radius:12px;background:repeating-conic-gradient(rgba(128,128,128,.18) 0 25%,transparent 0 50%) 0 0/14px 14px;background-position:center;background-repeat:no-repeat;cursor:pointer;padding:6px;font:inherit;color:var(--ink)}
.fimgb span{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-radius:8px;padding:4px 10px;font-size:12px;font-weight:500}
.tgrow{display:grid;grid-template-columns:1fr auto;align-items:center;width:100%;margin-top:8px;padding:8px 10px;border:0;border-radius:10px;background:var(--fill);font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.tgrow span{font-size:13px;font-weight:500}.tgrow small{grid-column:1;font-size:11px;color:var(--ink2);margin-top:1px}
.tgrow i{grid-column:2;grid-row:1/3;width:38px;height:23px;border-radius:12px;background:rgba(120,120,128,.32);position:relative;transition:background .2s}
.tgrow i::after{content:'';position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tgrow.on i{background:#34C759}.tgrow.on i::after{transform:translateX(15px)}
#rchip{position:fixed;z-index:12;width:32px;height:32px;border-radius:11px;padding:0;display:none;place-items:center;cursor:pointer;color:var(--ink);touch-action:manipulation}
#rchip svg{width:17px;height:17px}#rchip.on{background:var(--accent);color:#fff;border-color:transparent}
@media (max-width:700px){#tools .b{width:40px;height:40px}.qi{min-width:62px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

      if(lin){const x1=parseFloat(g.getAttribute('x1')||0),y1=parseFloat(g.getAttribute('y1')||0),x2=parseFloat(g.getAttribute('x2')??1),y2=parseFloat(g.getAttribute('y2')||0);angle=Math.round(Math.atan2(x2-x1,-(y2-y1))*180/Math.PI);}

    const imgFromEl=async img=>{const href=img&&(img.getAttribute('href')||img.getAttribute('xlink:href'))||'';if(!href.startsWith('data:'))return null;
      const a=await assetFromBlob(dataURLtoBlob(href));if(!a)return null;return mk('image',{asset:a.aid,kind:a.kind,ar:a.dim.w/a.dim.h});};
    const paint=(el,n,kind)=>{const cs=getComputedStyle(el),v=cs[kind],op=parseFloat(cs[kind+'Opacity']??1);
      if(!v||v==='none'){n[kind+'On']=false;return null;}const m=v.match(/url\(\s*["']?#([^"')]+)["']?\s*\)/);
      if(m){const g=byId(m[1]);if(g&&kind==='fill'&&/gradient/i.test(g.nodeName)){const gr=gradOf(g);if(gr){n.fillOn=true;n.fillType=gr.type;n.grad=gr.grad;n.fill=gr.grad.stops[0].c;return null;}}
        if(g&&kind==='fill'&&/pattern/i.test(g.nodeName))return{pattern:g};n[kind+'On']=false;return null;}
      const c=parseColor(v);if(!c){n[kind+'On']=false;return null;}n[kind]=c.hex;n[kind+'A']=Math.round(c.a*op*1000)/1000;n[kind+'On']=true;return null;};
    const SKIP=['defs','clippath','mask','pattern','lineargradient','radialgradient','style','title','desc','metadata','filter','symbol','marker','script'];
    let count=0;
    const walk=async(el,pid)=>{for(const ch of[...el.children]){const tag=ch.nodeName.toLowerCase();if(SKIP.includes(tag))continue;
      const cs=getComputedStyle(ch);if(cs.display==='none'||cs.visibility==='hidden')continue;const op=parseFloat(cs.opacity||1),nm=ch.getAttribute('id')||ch.getAttribute('data-name');
      if(['g','a','switch','svg'].includes(tag)){const g=mk('group');if(nm)g.name=nm.slice(0,40);add(g,pid);g.opacity=op;await walk(ch,g.id);
        if(!g.children.length){del(g.id);continue;}
        if(g.children.length===1&&op===1){const c0=g.children[0],arr=kids(pid),i=arr.indexOf(g.id);arr.splice(i,1,c0);N(c0).parent=pid||null;delete doc.nodes[g.id];}continue;}
      let bb;try{bb=ch.getBBox();}catch(e){continue;}
      let n=null;
      if(tag==='text'){const t=(ch.textContent||'').replace(/\s+/g,' ').trim();if(!t)continue;n=mk('text');const M=ch.getCTM()||new DOMMatrix(),sy=Math.hypot(M.c,M.d)||1,fs=parseFloat(cs.fontSize)||16;
        const fam=(cs.fontFamily||'Inter').split(',')[0].replace(/["']/g,'').trim()||'Inter';Object.assign(n,{text:t,font:fam,weight:Math.min(900,Math.max(100,Math.round((parseInt(cs.fontWeight)||400)/100)*100)),fs:Math.round(fs*sy*10)/10,ls:parseFloat(cs.letterSpacing)||0,autoName:false,name:t.slice(0,32),tsize:'auto'});
        paint(ch,n,'fill');paint(ch,n,'stroke');place(ch,n,bb);n.y-=n.fs*(n.lh/100-1)/2;loadFont(fam);}
      else if(tag==='image'){n=await imgFromEl(ch);if(!n)continue;place(ch,n,bb);const par=ch.getAttribute('preserveAspectRatio')||'';if(par.startsWith('none')){n.fit='crop';n.m={x:0,y:0,w:1,h:1};}else n.fit=/slice/.test(par)?'fill':'fit';}
      else if(tag==='line'){n=mk('line');const M=ch.getCTM()||new DOMMatrix(),T=(x,y)=>({x:OX+M.a*x+M.c*y+M.e,y:OY+M.b*x+M.d*y+M.f});
        setLine(n,T(+ch.getAttribute('x1')||0,+ch.getAttribute('y1')||0),T(+ch.getAttribute('x2')||0,+ch.getAttribute('y2')||0));paint(ch,n,'stroke');n.sw=(parseFloat(cs.strokeWidth)||1)*(Math.hypot(M.a,M.b)||1);}
      else{if(tag==='rect'){n=mk('rect');n.radius=parseFloat(ch.getAttribute('rx')||ch.getAttribute('ry')||0)||0;}
        else if(tag==='circle'||tag==='ellipse')n=mk('ellipse');
        else{const d=tag==='path'?ch.getAttribute('d'):(tag==='polygon'||tag==='polyline')?'M'+(ch.getAttribute('points')||'').trim().replace(/\s+/g,' ')+(tag==='polygon'?'Z':''):null;if(!d)continue;
          n=mk('vector');n.d=d;n.vb={x:bb.x,y:bb.y,w:Math.max(bb.width,.01),h:Math.max(bb.height,.01)};n.rule=cs.fillRule==='evenodd'?'evenodd':'nonzero';}
        const pf=paint(ch,n,'fill');paint(ch,n,'stroke');const sc=place(ch,n,bb);if(n.radius)n.radius*=sc.sx;n.sw=(parseFloat(cs.strokeWidth)||1)*((sc.sx+sc.sy)/2);
        if(pf&&pf.pattern){const pt=pf.pattern,u=pt.querySelector('use'),img=pt.querySelector('image')||(u&&byId((u.getAttribute('href')||u.getAttribute('xlink:href')||'').slice(1)));
          const im=await imgFromEl(img);if(im){Object.assign(im,{x:n.x,y:n.y,w:n.w,h:n.h,rot:n.rot,radius:n.type==='rect'?n.radius:0,fit:'fill'});n=im;}}}
      if(!n)continue;n.opacity=op;if(nm&&n.type!=='text')n.name=nm.slice(0,40);if(cs.mixBlendMode&&cs.mixBlendMode!=='normal')n.blend=cs.mixBlendMode;add(n,pid);count++;}};
    await walk(sv,ab.id);
    if(at){if(!ab.children.length){del(ab.id);toast('Nessun livello nello SVG');return;}
      if(ab.children.length===1){const c0=ab.children[0],arr=kids(ab.parent),i=arr.indexOf(ab.id);arr.splice(i,1,c0);N(c0).parent=ab.parent||null;delete doc.nodes[ab.id];sel=[c0];}else sel=[ab.id];
      commit();toast(`SVG incollato: ${count} livelli`);return;}
    const first=N(ab.children[0]);if(first&&first.type==='rect'&&Math.abs(first.x-ab.x)<1&&Math.abs(first.y-ab.y)<1&&Math.abs(first.w-ab.w)<1&&Math.abs(first.h-ab.h)<1&&!first.rot&&(first.fillType||'solid')==='solid'&&!first.strokeOn){ab.fill=first.fill;ab.fillA=first.fillA;ab.fillOn=first.fillOn;del(first.id);}
    sel=[ab.id];commit();fitTo([ab.id]);toast(`SVG importato: ${count} livelli`);}
  catch(err){console.error(err);toast('Import SVG non riuscito');}
  finally{host.remove();}}

/* ---------- boot ---------- */
let saved=null;try{saved=localStorage.getItem('tavola.doc')}catch(e){}
try{if(saved){doc=JSON.parse(saved);if(!doc.nodes||!doc.root)throw 0;}else throw 0;}catch(e){newDoc();}
if(!doc.id)doc.id=nid();doc.guides=doc.guides||[];hist=[JSON.stringify(doc)];hi=0;
Object.values(doc.nodes).forEach(n=>{if(n.type==='text')loadFont(n.font);});
idbOpen().then(idbLoad).then(()=>{inv();saveDocRecord();});
panels();
addEventListener('resize',inv);
requestAnimationFrame(()=>{fitTo(doc.root);if(!saved)setTimeout(()=>toast('Benvenuto in Forma. Scegli uno strumento in basso e disegna sulla tavola.'),400);});
inv();
}
